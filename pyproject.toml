[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kam-market-ai"
version = "0.1.0"
description = "空明期貨 KAM 個人 Shadow 實證實驗系統"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - private personal research only" }
authors = [{ name = "KAM" }]
dependencies = [
  "fugle-marketdata==2.4.1",
  "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<6",
  "ruff>=0.9,<1",
  "mypy>=1.13,<2",
]

[project.scripts]
kam-shadow = "kam_market_ai.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["kam_market_ai"]
